<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Language / Gesture Recognition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
            text-align: center;
            padding-top: 30px;
        }
        h1 {
            color: #4CAF50;
        }
        img {
            border: 4px solid #4CAF50;
            border-radius: 8px;
            margin-top: 20px;
        }
        .warning {
            color: #ffb84d;
            margin-top: 15px;
        }
        .gestures {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Gesture / Sign Recognition — Live Demo</h1>
    <p class="gestures">Recognizes: Fist, Open Palm, Pointing Up, Thumbs Up/Down, Victory, and the ASL "I Love You" sign</p>
    {% if not model_ready %}
    <p class="warning">Model not found. Run "python download_model.py" first.</p>
    {% endif %}
    <img src="{{ url_for('video_feed') }}" width="720" height="540">
</body>
</html>
